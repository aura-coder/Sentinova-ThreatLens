version: '3.8'

services:
  db:
    image: postgres:15
    container_name: threatlens_db
    environment:
      POSTGRES_USER: threatlens_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: threatlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: threatlens_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: threatlens_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: threatlens_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://threatlens_user:supersecretpassword@db:5432/threatlens
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET_KEY: super_secret_key_123
    depends_on:
      - db
      - redis
      - elasticsearch
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: threatlens_ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
